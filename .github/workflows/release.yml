name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag existente a re-publicar (ej: v0.2.0). Solo úsalo si el release inicial falló."
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Package skills and publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: Resolve tag name
        id: tag
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "name=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Package each skill as a standalone zip
        run: |
          set -euo pipefail
          mkdir -p dist
          for skill_dir in skills/*/; do
            skill_name="$(basename "$skill_dir")"
            if [ "$skill_name" = "_template" ]; then
              echo "  ⏭️  Skipping $skill_name"
              continue
            fi
            (cd "$skill_dir" && zip -qr "../../dist/${skill_name}-${{ steps.tag.outputs.name }}.zip" .)
            echo "  ✅ Packaged $skill_name"
          done

      - name: Package full toolkit bundle
        run: |
          set -euo pipefail
          zip -qr "dist/claude-skills-toolkit-${{ steps.tag.outputs.name }}.zip" \
            skills/ \
            scripts/ \
            docs/ \
            README.md \
            INSTALL.md \
            CONTRIBUTING.md \
            CHANGELOG.md \
            ROADMAP.md \
            SECURITY.md \
            SUPPORT.md \
            CODE_OF_CONDUCT.md \
            LICENSE
          ls -lh dist/

      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          set -euo pipefail
          VERSION="${{ steps.tag.outputs.version }}"
          awk -v v="[${VERSION}]" '
            $0 ~ ("^## .*" v) { capture = 1; next }
            capture && /^## / { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Release ${{ steps.tag.outputs.name }}" > release-notes.md
            echo "" >> release-notes.md
            echo "_(Notas específicas no encontradas en CHANGELOG.md para esta versión.)_" >> release-notes.md
          fi
          {
            echo ""
            echo "---"
            echo ""
            echo "### 📦 Descarga"
            echo ""
            echo "- \`claude-skills-toolkit-${{ steps.tag.outputs.name }}.zip\` — toolkit completo (skills + docs + scripts)."
            echo "- \`<skill>-${{ steps.tag.outputs.name }}.zip\` — un zip por skill individual."
          } >> release-notes.md

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG ya existe — actualizando assets"
            gh release upload "$TAG" dist/*.zip --clobber
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file release-notes.md \
              dist/*.zip
          fi
