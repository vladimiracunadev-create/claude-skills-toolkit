name: Skill scan

# Escanea cada skill del toolkit con SkillSpector (fork de NVIDIA/skillspector)
# en busca de patrones maliciosos: prompt injection, exfiltración, supply chain,
# escalada de privilegios, abuso de herramientas.
#
# Corre sobre un checkout limpio a propósito: en una copia de trabajo local los
# __pycache__/ generados por pytest disparan 37 hallazgos HIGH de "Concealed
# Executable Artifact" que no existen en el repo (están en .gitignore).
#
# La capa LLM va deshabilitada (`--no-llm` dentro del runner): enviaría el
# contenido de los skills a un proveedor externo. El CI se queda en estático.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  skill-scan:
    name: SkillSpector · skills/
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Para subir el SARIF a la pestaña Security del repo.
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # Pinneado al commit exacto del fork, no a `main`: así un push en el repo
      # del scanner no cambia lo que este CI ejecuta. Ver docs/supply-chain-security.md.
      - name: Install SkillSpector
        env:
          SKILLSPECTOR_REF: "e14c450b260958ed3ebd83c94c09c4b093e3e656"
        run: |
          set -euo pipefail
          pip install "git+https://github.com/vladimiracunadev-create/SkillSpector.git@${SKILLSPECTOR_REF}"
          skillspector --version

      # Gate duro: un skill con score > 50 rompe el build. Los hallazgos ya
      # triados viven en docs/security/skillspector-baselines/<skill>.yaml con
      # su justificación, y el runner los pasa con --baseline.
      #
      # El SARIF se escribe en la misma pasada (una invocación del scanner por
      # skill, no dos) y sale unificado en un solo run con rutas relativas al
      # repo, porque GitHub acepta como máximo 20 runs por envío.
      - name: Scan every skill
        run: |
          python scripts/skillspector_scan.py \
            --max-score 50 \
            --sarif sarif/skillspector.sarif

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@8498dc4c2b27cdd99baf0f87955b29ebbf30c78d # v4.39.1
        with:
          sarif_file: sarif/
          category: skillspector

      - name: Informe como artefacto
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: skillspector-report
          path: |
            docs/security/SKILLSPECTOR_*.md
            docs/security/skillspector-latest.json
          if-no-files-found: warn
