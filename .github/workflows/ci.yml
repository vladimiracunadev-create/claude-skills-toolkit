name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  yaml-lint:
    name: YAML & workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install PyYAML
        run: pip install pyyaml

      # El script va anclado a un tag inmutable, no a `main`: así un commit en
      # el repo de actionlint no puede cambiar lo que este CI ejecuta.
      # Ver docs/supply-chain-security.md.
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
        run: |
          set -euo pipefail
          curl -fsSL -o download-actionlint.bash \
            "https://raw.githubusercontent.com/rhysd/actionlint/v${ACTIONLINT_VERSION}/scripts/download-actionlint.bash"
          bash download-actionlint.bash "${ACTIONLINT_VERSION}"
          echo "$PWD" >> "$GITHUB_PATH"

      - name: Run yaml-control over the repo
        run: python skills/yaml-control/yaml_control.py --all

  markdown-lint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      # Usamos pnpm en lugar de npm para reducir superficie ante ataques tipo
      # Shai-Hulud (postinstall bloqueado por defecto + minimumReleaseAge=1d).
      # Ver docs/supply-chain-security.md.
      - name: Install pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 11

      - name: Install markdownlint-cli2
        run: pnpm add -g markdownlint-cli2

      - name: Lint Markdown files (report-only)
        run: |
          markdownlint-cli2 "**/*.md" "#node_modules" || true

  python-tests:
    name: Python smoke tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install minimal deps
        run: pip install pyyaml

      - name: Run tests
        run: python -m unittest discover -s tests -v

  # Las tres capas de security-audit que auditan ESTE repo (no sus inexistentes
  # dependencias). Corren con versiones fijas para que un hallazgo nuevo venga
  # de un cambio nuestro y no de un scanner que cambió de criterio.
  # La cobertura declarada está en SECURITY.md.
  security:
    name: Security scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          # gitleaks revisa el histórico completo: con el clone superficial por
          # defecto solo vería el último commit, que es justo el que ya miraste.
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install scanners
        env:
          BANDIT_VERSION: "1.9.4"
          ZIZMOR_VERSION: "1.5.2"
        run: pip install "bandit==${BANDIT_VERSION}" "zizmor==${ZIZMOR_VERSION}"

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          # Release pinneado y checksum fijado aquí: si el asset cambia bajo el
          # mismo tag, el job falla en vez de ejecutar otro binario.
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          curl -fsSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version

      # Gate duro: cualquier hallazgo MEDIUM o HIGH nuevo rompe el build. Es la
      # clase que importa (shell=True, secretos embebidos, hash débil, permisos
      # permisivos) y no depende de números de línea, así que no da falsos
      # positivos cuando el código se mueve.
      - name: SAST · Bandit (gate MEDIUM+)
        run: python -m bandit -q -r skills tests --severity-level medium

      # Informativo a propósito: el baseline se ancla a fichero y línea, así que
      # un refactor amplio reporta como "nuevo" algo ya aceptado. Rompe el log,
      # no el build; si aparece un LOW de verdad nuevo, se ve aquí.
      - name: SAST · Bandit vs baseline (informativo)
        continue-on-error: true
        run: python -m bandit -q -r skills tests -b .bandit-baseline.json

      - name: Workflows · zizmor
        env:
          # Habilita las auditorías que consultan la API: impostor-commit,
          # ref-confusion y known-vulnerable-actions.
          GH_TOKEN: ${{ github.token }}
        run: zizmor --no-progress --persona auditor --min-severity medium .github/workflows/

      - name: Secretos · gitleaks sobre el histórico completo
        run: ./gitleaks git --no-banner --redact --exit-code 1 .
