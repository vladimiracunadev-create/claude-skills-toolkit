    (B404/B603/B607) y declarado en el modelo de amenaza de SECURITY.md.'
- hash: sha256:3c2929964fc44ca3f44a618f6386dc1aba37a03ab2f270ce8fd3937381f37dc6
  rule_id: LP3
  file: SKILL.md
  reason: '[by_design] Resuelto en lo que el hallazgo denuncia —la opacidad— y deliberado
    en lo que queda. Los 23 SKILL.md declaran ahora su alcance: `metadata.capabilities`
    en el frontmatter (legible por herramientas, sin efecto sobre permisos), una sección
    "Alcance y permisos" con qué toca y qué nunca toca, y `disallowed-tools` retirando
    WebFetch/WebSearch en los 14 skills verificablemente locales, que es el único
    techo real de permisos que ofrece el runtime. Lo que NO se declara, a propósito,
    es `allowed-tools`: la propia remediación de SkillSpector avisa de que registra
    herramientas PREAPROBADAS, no un techo, y de no añadir ninguna "para silenciar
    este hallazgo". Declararlo quitaría la confirmación del usuario sin acotar nada
    — peor postura con la métrica en verde. Tampoco se añade `permissions`, que es
    un campo de manifiestos MCP y no existe en el frontmatter de un Agent Skill. Sostenido
    por tests/test_skill_scope.py: un skill sin declaración, o cuya declaración se
    quede corta respecto a su propio script, rompe la suite; y declarar `allowed-tools`
    también la rompe. Ver el caso 3 de skillspector-hallazgos.md.'
